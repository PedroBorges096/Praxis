<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Podcast — PRAXIS</title>
<meta name="description" content="Podcast PRAXIS: política e economia explicadas em conversa. Ouça ou assista.">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#8B1E2D">
<link rel="icon" href="img/icone.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<style>
  .pod-hero { display: flex; flex-wrap: wrap; gap: 28px; align-items: center; padding: 40px 0 28px; }
  .pod-hero__capa { width: 200px; height: 200px; flex: 0 0 auto; border-radius: 8px; background: linear-gradient(135deg, var(--bordo), var(--grafite-escuro)); color: #fff; display: flex; align-items: center; justify-content: center; text-align: center; font-family: var(--serif); font-weight: 800; font-size: 28px; line-height: 1.1; padding: 16px; }
  .pod-hero h1 { margin: 0 0 8px; font-family: var(--serif); font-size: clamp(34px, 5vw, 54px); line-height: 1.05; }
  .pod-hero p { margin: 0 0 14px; font-size: 18px; color: var(--texto-forte); max-width: 640px; }
  .pod-plataformas { display: flex; flex-wrap: wrap; gap: 10px; }
  .eps { display: flex; flex-direction: column; gap: 22px; }
  .ep { background: var(--branco); border: 1px solid var(--linha); padding: 22px; display: flex; flex-wrap: wrap; gap: 22px; scroll-margin-top: 80px; }
  .ep__capa { width: 150px; height: 150px; flex: 0 0 auto; object-fit: cover; border-radius: 6px; background: linear-gradient(135deg, var(--bordo), var(--grafite-escuro)); color: #fff; display: flex; align-items: center; justify-content: center; font-family: var(--serif); font-weight: 800; font-size: 40px; }
  .ep__corpo { flex: 1 1 340px; min-width: 0; display: flex; flex-direction: column; gap: 10px; }
  .ep__num { font-size: 12px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--bordo); }
  [data-tema="escuro"] .ep__num { color: #E8A3AD; }
  .ep h2 { margin: 0; font-family: var(--serif); font-size: 26px; line-height: 1.2; }
  .ep__desc { margin: 0; color: var(--texto-forte); }
  .modo { display: inline-flex; border: 1px solid var(--linha); border-radius: 24px; padding: 4px; gap: 4px; align-self: flex-start; background: var(--fundo); }
  .modo button { min-height: 40px; padding: 0 18px; border: 0; border-radius: 20px; background: transparent; font-weight: 700; cursor: pointer; color: var(--texto); }
  .modo button[aria-pressed="true"] { background: var(--bordo); color: #fff; }
  .modo button:disabled { opacity: .4; cursor: not-allowed; }
  .player { width: 100%; }
  .player iframe { width: 100%; border: 0; border-radius: 8px; }
  .player__video { position: relative; aspect-ratio: 16/9; background: #000; }
  .player__video iframe { position: absolute; inset: 0; height: 100%; border-radius: 0; }
  .player audio { width: 100%; }
  .velocidade { display: flex; gap: 6px; align-items: center; font-size: 13px; margin-top: 6px; flex-wrap: wrap; }
  .velocidade button { min-height: 32px; padding: 0 10px; border: 1px solid var(--linha); background: var(--fundo); color: var(--texto); border-radius: 16px; cursor: pointer; font-weight: 600; }
  .velocidade button[aria-pressed="true"] { background: var(--grafite); color: var(--fundo); }
  .vazio { padding: 20px; background: var(--areia); border-radius: 6px; font-size: 14px; color: var(--texto-suave); }
  .capitulos { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
  .capitulos button { width: 100%; text-align: left; display: flex; gap: 14px; padding: 10px 0; border: 0; border-bottom: 1px solid var(--linha); background: none; cursor: pointer; color: var(--texto); font-size: 15px; }
  .capitulos button:hover { color: var(--bordo); }
  .capitulos b { font-variant-numeric: tabular-nums; color: var(--bordo); min-width: 52px; }
  details.transcricao summary { cursor: pointer; font-weight: 700; padding: 6px 0; }
  details.transcricao div { font-size: 15px; line-height: 1.7; max-height: 420px; overflow: auto; padding-right: 8px; }
  .mini { position: fixed; left: 0; right: 0; bottom: 0; z-index: 40; background: var(--grafite-escuro); color: #fff; padding: 10px var(--gutter); display: flex; align-items: center; gap: 14px; box-shadow: 0 -6px 20px rgba(0,0,0,.25); }
  .mini[hidden] { display: none; }
  .mini__play { width: 44px; height: 44px; border-radius: 50%; border: 0; background: var(--bordo); color: #fff; font-size: 18px; cursor: pointer; flex: 0 0 auto; }
  .mini__info { flex: 1 1 auto; min-width: 0; }
  .mini__titulo { font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 14px; }
  .mini__barra { height: 4px; background: #2E3A4C; border-radius: 2px; margin-top: 6px; overflow: hidden; }
  .mini__barra span { display: block; height: 4px; background: #E8A3AD; width: 0; }
  .mini__tempo { font-size: 12px; color: #9AA3B2; font-variant-numeric: tabular-nums; flex: 0 0 auto; }
  body.com-mini { padding-bottom: 72px; }
</style>
</head>
<body data-pagina="podcast">
<div id="topo"></div>
<main class="container">
  <section class="pod-hero">
    <div class="pod-hero__capa" aria-hidden="true">PRAXIS<br>Podcast</div>
    <div>
      <div class="eyebrow">Podcast</div>
      <h1>PRAXIS</h1>
      <p>Análise política e de conjuntura, em conversa com Sthephanye Silva. Escolha ouvir ou assistir cada episódio.</p>
      <div class="pod-plataformas" id="plataformas"></div>
    </div>
  </section>
  <div id="status"><div class="carregando">Carregando episódios…</div></div>
  <div class="eps" id="episodios"></div>
</main>

<div class="mini" id="mini" hidden role="region" aria-label="Player do podcast">
  <button type="button" class="mini__play" id="mini-play" aria-label="Pausar">❚❚</button>
  <div class="mini__info"><div class="mini__titulo" id="mini-titulo"></div><div class="mini__barra"><span id="mini-barra"></span></div></div>
  <span class="mini__tempo" id="mini-tempo"></span>
</div>

<div id="rodape"></div>
<script src="js/config.js"></script>
<script src="js/layout.js"></script>
<script src="js/ticker.js"></script>
<script src="js/render.js"></script>
<script src="js/podcast.js"></script>
</body>
</html>
